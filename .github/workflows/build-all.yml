name: Virgo Multi-Platform Build Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # 1. ANDROID APK BUILD (UBUNTU RUNNER)
  # -------------------------------------------------------------
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install

      - name: Sync Capacitor Web Assets
        run: |
          mkdir -p www
          cp index.html icon.png manifest.json sw.js www/ 2>/dev/null || true
          npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: virgo-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # -------------------------------------------------------------
  # 2. WINDOWS DESKTOP APP BUILD (WINDOWS RUNNER)
  # -------------------------------------------------------------
  build-windows:
    name: Build Windows Desktop App
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Compile Go Gateway for Windows
        run: go build -o gateway.exe main.go

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Desktop Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 win11toast pyinstaller

      - name: Build Standalone Desktop App (PyInstaller)
        run: pyinstaller --noconfirm Virgo.spec

      - name: Compress Desktop App Directory
        run: Compress-Archive -Path dist\Virgo -DestinationPath virgo-windows-desktop.zip

      - name: Upload Windows Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: virgo-windows-desktop
          path: virgo-windows-desktop.zip
          if-no-files-found: error

  # -------------------------------------------------------------
  # 3. LINUX GATEWAY SERVER BINARY (UBUNTU RUNNER)
  # -------------------------------------------------------------
  build-linux-server:
    name: Build Linux Server Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Compile Static Linux Gateway Binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o gateway-linux main.go

      - name: Upload Linux Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: virgo-linux-server-binary
          path: gateway-linux
          if-no-files-found: error
