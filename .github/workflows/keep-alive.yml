name: 24-7 Server Keep Alive

on:
  schedule:
    # Trigger every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-server:
    name: Ping Cloud Server
    runs-on: ubuntu-latest
    steps:
      - name: Ping Virgo Render Endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://virgo-chat.onrender.com/)
          echo "Server responded with HTTP status: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "Warning: Received HTTP $STATUS"
          fi
